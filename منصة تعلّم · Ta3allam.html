<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تعلّم · Ta3allam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#14213d;--muted:#5b6478;--line:#dde1e8;--accent:#0f7f82;--accent-ink:#fff;--hi:#ffc93c;--ok:#1b7a43;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#161e33;--ink:#eef1f7;--muted:#9aa4bb;--line:#26304d;--accent:#3cc4c7;--accent-ink:#0e1424;--ok:#5fd18c;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#161e33;--ink:#eef1f7;--muted:#9aa4bb;--line:#26304d;--accent:#3cc4c7;--accent-ink:#0e1424;--ok:#5fd18c;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.88}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}
.logo{font-weight:700;font-size:1.25rem;display:flex;gap:8px;align-items:center}
.logo i{width:14px;height:14px;background:var(--hi);border-radius:50% 50% 50% 0;display:inline-block}
.nav{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 16px}
.ghost:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.hero{padding:40px 0 28px;max-width:560px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.2;margin:0 0 14px;font-weight:700}
.hero p{color:var(--muted);margin:0 0 24px;font-size:1.05rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
.tools input{max-width:300px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 16px}
.chip[aria-pressed=true],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding:6px 0 56px;perspective:1100px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .2s;transform-style:preserve-3d;box-shadow:0 2px 6px rgba(20,33,61,.08)}
.card:hover{box-shadow:0 18px 36px rgba(20,33,61,.22)}
.cover{height:104px;display:flex;align-items:flex-end;padding:12px 18px;font-size:2.2rem;font-weight:700;perspective:300px;color:#fff}
.cover span{display:inline-block;transform:rotateY(-20deg) rotateX(10deg);text-shadow:3px 4px 0 rgba(0,0,0,.28);transition:transform .45s}
.card:hover .cover span{transform:rotateY(20deg) rotateX(-6deg) translateZ(14px)}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:1.1rem;line-height:1.4}
.body p{margin:0;color:var(--muted);font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:700}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 18px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.done{background:transparent;color:var(--ok);border:1px solid var(--ok);cursor:default}
.btn.sm{padding:4px 12px;font-size:.85rem}.btn.danger{background:var(--bad);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.6)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:1.25rem}
.dlg label{font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=color]{padding:2px;height:44px}
.err{color:var(--bad);font-size:.82rem;min-height:1.2em}
.row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.on{opacity:1}
#admin{padding-bottom:56px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:8px 0 20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.8rem;line-height:1.2}.stat span{color:var(--muted);font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
td.d{direction:ltr;text-align:start}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="logo"><i></i><span data-t="brand"></span></div>
    <div class="nav">
      <button class="ghost" id="accBtn" hidden></button>
      <button class="ghost" id="myBtn" hidden data-t="my"></button>
      <button class="ghost" id="admBtn" hidden></button>
      <button class="ghost" id="langBtn" aria-label="Switch language"></button>
    </div>

  <div id="shop">
    <section class="hero">
      <h1 data-t="h1"></h1>
      <p data-t="sub"></p>
      <div class="tools">

        <span id="chips" role="group"></span>
      </div>

    <main class="grid" id="grid" aria-live="polite"></main>
  </div>
  <section id="admin" hidden></section>
</div>

<dialog id="dlg"><div class="dlg">

    <label><span data-t="f_l"></span><input id="c_l" type="number" min="0" dir="ltr"></label>
    <label><span data-t="f_p"></span><input id="c_p" type="number" min="0" dir="ltr"></label>
    <label><span data-t="f_s"></span><input id="c_s" type="number" min="0" dir="ltr"></label>

  <div class="row"><button class="ghost" id="ccancel" type="button" data-t="cancel"></button><button class="btn" id="csave" type="button" data-t="save"></button></div>
</div></dialog>
<dialog id="mdlg"><div class="dlg"><h2 data-t="man"></h2>
  <label><span data-t="name"></span><input id="m_n"></label>
  <label><span data-t="email"></span><input id="m_e" type="email" dir="ltr"></label>
  <label><span data-t="phone"></span><input id="m_p" type="tel" dir="ltr"></label>
  <label><span data-t="col_c"></span><select id="m_c"></select></label>
  <label><span data-t="col_s"></span><select id="m_s"></select></label>
  <div class="err" id="merr" role="alert"></div>
  <div class="row"><button class="ghost" id="mcancel" type="button" data-t="cancel"></button><button class="btn" id="msave" type="button" data-t="save"></button></div>
</div></dialog>
<dialog id="pdlg"><div class="dlg"><h2 data-t="payT"></h2><p id="pB" style="white-space:pre-wrap;margin:0"></p>

</div></dialog>

</div></dialog>
<div id="toast" role="status"></div>

/* ---------- 3D background (three.js) ---------- */
function initGL(){
  if(!window.THREE)return;
  var R;try{R=new THREE.WebGLRenderer({canvas:$("gl"),alpha:true,antialias:true})}catch(e){return}
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,1,.1,100);C.position.z=9;
  S.add(new THREE.AmbientLight(0xffffff,.75));
  var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,8);S.add(dl);
  var geos=[new THREE.IcosahedronGeometry(1,0),new THREE.TorusGeometry(.9,.32,16,40),new THREE.OctahedronGeometry(1,0),new THREE.BoxGeometry(1.4,1.4,1.4),new THREE.ConeGeometry(.9,1.6,5)];
  var cols=[0x0f7f82,0x3cc4c7,0xffc93c,0x7a3e9d,0xc2185b,0xb5541c],ms=[];
  for(var i=0;i<14;i++){
    var m=new THREE.Mesh(geos[i%5],new THREE.MeshStandardMaterial({color:cols[i%6],roughness:.45,metalness:.1,wireframe:i%4===3}));
    m.position.set((Math.random()-.5)*18,(Math.random()-.5)*14,-Math.random()*6-1);
    m.scale.setScalar(.5+Math.random()*.7);m.userData={sp:.2+Math.random()*.5,ph:Math.random()*6.28,y:m.position.y};S.add(m);ms.push(m);
  }
  var hk=new THREE.Mesh(new THREE.TorusKnotGeometry(1,.34,100,16),new THREE.MeshStandardMaterial({color:0xffc93c,roughness:.3,metalness:.2}));S.add(hk);
  function place(){var n=C.aspect<.9;hk.position.set(n?0:(document.documentElement.dir==="rtl"?-4.2:4.2),n?3.4:1.4,0);hk.scale.setScalar(n?.7:1.15)}
  var mx=0,my=0,still=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();place();if(still)draw(0)}
  function draw(t){
    t*=.001;
    ms.forEach(function(m){var u=m.userData;m.rotation.x=t*u.sp;m.rotation.y=t*u.sp*1.3;m.position.y=u.y+Math.sin(t*.6+u.ph)*.4});
    hk.rotation.x=t*.4;hk.rotation.y=t*.6;
    C.position.x+=(mx*2-C.position.x)*.05;C.position.y+=(-my*1.5-window.scrollY*.004-C.position.y)*.05;
    C.lookAt(0,C.position.y,0);R.render(S,C);
  }
  function loop(t){draw(t);requestAnimationFrame(loop)}
  addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  addEventListener("resize",size);size();
  if(!still)requestAnimationFrame(loop);
  GL={place:function(){place();if(still)draw(0)}};
}
applyLang();route();initGL();if(GL)GL.place();
